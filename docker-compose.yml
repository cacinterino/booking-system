services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: src/Booking.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-booking};Username=${POSTGRES_USER:-booking};Password=${POSTGRES_PASSWORD:-booking}"
      Jwt__Key: "${JWT_KEY:-local-dev-only-key-change-me-at-least-32-characters}"
      Jwt__Issuer: "${JWT_ISSUER:-Booking.Api}"
      Jwt__Audience: "${JWT_AUDIENCE:-Booking.Client}"
      AllowedOrigins: "${ALLOWED_ORIGINS:-http://localhost:5173}"
      Seed__Demo: "${SEED_DEMO:-true}"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./booking-client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./booking-client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:5000}"
    depends_on:
      - api

volumes:
  pgdata:
  pgadmin-data:
